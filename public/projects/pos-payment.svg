  <text x="1079" y="112" text-anchor="middle" fill="#047857" font-size="13" font-weight="600">Online</text>
  <path d="M140 134H1140" stroke="#e4e4e7"/>

  <!-- Left: tender -->
  <rect x="166" y="160" width="520" height="110" rx="10" fill="#ffffff" stroke="#e4e4e7"/>
  <rect x="166" y="160" width="5" height="110" rx="2" fill="#b91c1c"/>
  <text x="192" y="194" fill="#71717a" font-size="12" font-weight="600" letter-spacing="0.5">AMOUNT DUE</text>
  <text x="192" y="250" fill="#b91c1c" font-size="50" font-weight="700" letter-spacing="-1">149.43</text>

  <text x="170" y="306" fill="#18181b" font-size="16" font-weight="700">Payment method</text>
  <g font-size="15" font-weight="600" text-anchor="middle">
    <rect x="166" y="320" width="166" height="62" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="249" y="357" fill="#047857">Cash</text>
    <rect x="343" y="320" width="166" height="62" rx="8" fill="#ffffff" stroke="#d4d4d8"/><text x="426" y="357" fill="#3f3f46">Card</text>
    <rect x="520" y="320" width="166" height="62" rx="8" fill="#ffffff" stroke="#d4d4d8"/><text x="603" y="357" fill="#3f3f46">QR code</text>
  </g>

  <text x="170" y="420" fill="#18181b" font-size="16" font-weight="700">Amount received</text>
  <g font-size="15" font-weight="600" fill="#3f3f46" text-anchor="middle">
    <rect x="166" y="434" width="122" height="48" rx="8" fill="#f4f4f5" stroke="#e4e4e7"/><text x="227" y="464">1,000</text>
    <rect x="298" y="434" width="122" height="48" rx="8" fill="#f4f4f5" stroke="#e4e4e7"/><text x="359" y="464">500</text>
    <rect x="430" y="434" width="122" height="48" rx="8" fill="#f4f4f5" stroke="#e4e4e7"/><text x="491" y="464">200</text>
    <rect x="562" y="434" width="124" height="48" rx="8" fill="#f4f4f5" stroke="#e4e4e7"/><text x="624" y="464">Exact</text>
  </g>
  <rect x="166" y="496" width="520" height="40" rx="8" fill="#ffffff" stroke="#e4e4e7" stroke-dasharray="5 4"/>
  <text x="426" y="521" text-anchor="middle" fill="#52525b" font-size="14" font-weight="600">+ Split across several tenders</text>
  <rect x="166" y="556" width="520" height="62" rx="10" fill="#18181b"/>
  <text x="426" y="594" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700">Confirm payment</text>

  <!-- Right: summary -->
  <path d="M715 134V650" stroke="#e4e4e7"/>
  <rect x="870" y="160" width="140" height="28" rx="14" fill="#fef3c7"/>
  <text x="940" y="179" text-anchor="middle" fill="#92400e" font-size="13" font-weight="600">Waiting for cash</text>
  <rect x="740" y="206" width="370" height="150" rx="10" fill="#ffffff" stroke="#e4e4e7"/>
  <g font-size="15">
    <text x="762" y="244" fill="#52525b">Amount due</text><text x="1088" y="244" text-anchor="end" fill="#18181b">149.43</text>
    <text x="762" y="280" fill="#52525b">Received (cash)</text><text x="1088" y="280" text-anchor="end" fill="#18181b">0.00</text>
    <path d="M762 302H1088" stroke="#f4f4f5"/>
    <text x="762" y="334" fill="#18181b" font-weight="700">Change due</text><text x="1088" y="334" text-anchor="end" fill="#047857" font-size="18" font-weight="700">0.00</text>
  </g>
  <rect x="740" y="376" width="370" height="96" rx="10" fill="#f4f4f5"/>
  <text x="762" y="408" fill="#3f3f46" font-size="14" font-weight="600">Receipt</text>
  <text x="762" y="432" fill="#71717a" font-size="13">Sent to the fiscal journal on confirmation.</text>
  <text x="762" y="454" fill="#71717a" font-size="13">Queued automatically when offline.</text>
