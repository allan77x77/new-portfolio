<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1280" height="720" fill="#18181b"/>
  <g fill="none" stroke="#27272a" stroke-width="1">
    <path d="M0 120H1280M0 240H1280M0 360H1280M0 480H1280M0 600H1280"/>
    <path d="M160 0V720M320 0V720M480 0V720M640 0V720M800 0V720M960 0V720M1120 0V720"/>
  </g>

  <!-- App window -->
  <rect x="140" y="80" width="1000" height="570" rx="16" fill="#fafafa"/>
  <path d="M156 80h968a16 16 0 0 1 16 16v38H140V96a16 16 0 0 1 16-16z" fill="#f4f4f5"/>
  <circle cx="166" cy="107" r="6" fill="#d4d4d8"/><circle cx="186" cy="107" r="6" fill="#d4d4d8"/><circle cx="206" cy="107" r="6" fill="#d4d4d8"/>
  <text x="232" y="114" fill="#18181b" font-size="19" font-weight="700">Point of Sale · Payment</text>
